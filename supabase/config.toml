# Minimal Supabase CLI config for InvoiceFlow KSA.
# Run `supabase link --project-ref <ref>` once, then `pnpm supabase:push`
# and `pnpm supabase:deploy`.
project_id = "invoiceflow-ksa"

[functions.extract-invoice]
verify_jwt = true

[functions.sheets]
verify_jwt = true

# Google redirects the browser here without a Supabase JWT; the request is
# authenticated by the signed `state` parameter instead.
[functions.sheets-callback]
verify_jwt = false

[functions.delete-account]
verify_jwt = true

[auth]
site_url = "invoiceflowksa://"
additional_redirect_urls = ["invoiceflowksa://auth-callback", "invoiceflowksa://**", "exp://**", "http://localhost:8081"]
enable_signup = true
# Guest mode: lets the app call the AI with a limited quota before sign-in.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
otp_expiry = 3600

